  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0D0D0D" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0D0D0D" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowInk" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 18 9 L 0 18 z" fill="#0D0D0D"/>
    </marker>
    <marker id="arrowCyan" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 18 9 L 0 18 z" fill="#00E5FF"/>
    </marker>
    <marker id="arrowCoral" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 18 9 L 0 18 z" fill="#FF5A3C"/>
    </marker>
    <style>
      .bg { fill: #F6F3EC; }
