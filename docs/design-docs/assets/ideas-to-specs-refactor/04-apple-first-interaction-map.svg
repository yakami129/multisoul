  <g transform="translate(96 1440)">
    <rect width="1070" height="258" rx="34" fill="#0D0D0D" filter="url(#softShadow)"/>
    <text x="34" y="58" class="screenLabel" fill="#DDDDDD">APPLE-FIRST INTERACTION GRAMMAR</text>
    <text x="34" y="104" class="body" fill="#FFFFFF">1. Top-level Tab only changes major areas; actions stay in toolbar, row, sheet, or bottom safe area.</text>
    <text x="34" y="144" class="body" fill="#FFFFFF">2. Sheets handle scoped creation and target selection; navigation push handles durable detail views.</text>
    <text x="34" y="184" class="body" fill="#FFFFFF">3. Feedback stays inline, reversible actions get Undo, destructive actions use action sheet.</text>
    <text x="34" y="224" class="body" fill="#FFFFFF">4. Chat remains the interview surface; structured decisions are AskUserQuestion cards.</text>
  </g>
</svg>
