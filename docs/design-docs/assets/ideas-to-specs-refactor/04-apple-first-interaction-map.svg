      .section { fill: rgba(255,255,255,0.70); stroke: #E6E6E8; }
      .cyan { fill: #00E5FF; }
      .cyanSoft { fill: rgba(0,229,255,0.14); }
      .coral { fill: #FF5A3C; }
      .coralSoft { fill: rgba(255,90,60,0.12); }
      .lime { fill: #C6FF00; }
      .limeSoft { fill: rgba(198,255,0,0.18); }
      .sageSoft { fill: rgba(183,201,174,0.20); }
      .silver { fill: #E6E6E8; }
      .title { font: 800 52px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif; letter-spacing: 0; }
      .h1 { font: 800 34px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif; letter-spacing: 0; }
      .h2 { font: 800 26px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif; letter-spacing: 0; }
      .body { font: 500 21px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif; letter-spacing: 0; }
      .small { font: 500 17px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif; letter-spacing: 0; }
      .tiny { font: 700 14px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif; letter-spacing: 0; }
      .mono { font: 500 18px "SF Mono", ui-monospace, Menlo, monospace; letter-spacing: 0; }
      .screenLabel { font: 800 15px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif; letter-spacing: 1.5px; }
      .arrowLabel { font: 700 17px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif; letter-spacing: 0; }
    </style>
