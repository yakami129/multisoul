<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480" style="background:#fdf6e3; font-family: 'Caveat', cursive;">
  <defs>
    <!-- Hand-drawn wobble filter -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="roughStrong" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#00000022"/>
    </filter>
  </defs>

  <!-- Paper texture background lines -->
  <g opacity="0.06">
    <line x1="0" y1="40" x2="600" y2="40" stroke="#8B7355" stroke-width="1"/>
    <line x1="0" y1="80" x2="600" y2="80" stroke="#8B7355" stroke-width="1"/>
    <line x1="0" y1="120" x2="600" y2="120" stroke="#8B7355" stroke-width="1"/>
    <line x1="0" y1="160" x2="600" y2="160" stroke="#8B7355" stroke-width="1"/>
    <line x1="0" y1="200" x2="600" y2="200" stroke="#8B7355" stroke-width="1"/>
    <line x1="0" y1="240" x2="600" y2="240" stroke="#8B7355" stroke-width="1"/>
    <line x1="0" y1="280" x2="600" y2="280" stroke="#8B7355" stroke-width="1"/>
    <line x1="0" y1="320" x2="600" y2="320" stroke="#8B7355" stroke-width="1"/>
    <line x1="0" y1="360" x2="600" y2="360" stroke="#8B7355" stroke-width="1"/>
    <line x1="0" y1="400" x2="600" y2="400" stroke="#8B7355" stroke-width="1"/>
    <line x1="0" y1="440" x2="600" y2="440" stroke="#8B7355" stroke-width="1"/>
  </g>

  <!-- Title -->
  <text x="300" y="48" text-anchor="middle" font-size="32" font-weight="bold"
        fill="#2c1810" filter="url(#rough)"
        style="font-family: Georgia, serif; letter-spacing: 2px;">
    msctl  ✦  MultiSoul
  </text>
  <line x1="60" y1="58" x2="540" y2="60" stroke="#2c1810" stroke-width="2.5" filter="url(#rough)" opacity="0.6"/>

  <!-- === LEFT: Phone sketch === -->
  <!-- Phone body -->
  <rect x="60" y="90" width="140" height="260" rx="18" ry="18"
        fill="#fff8f0" stroke="#2c1810" stroke-width="3"
        filter="url(#roughStrong)" opacity="0.95"/>
  <!-- Phone screen -->
  <rect x="72" y="112" width="116" height="200" rx="6" ry="6"
        fill="#1a1a2e" stroke="#2c1810" stroke-width="2"
        filter="url(#rough)"/>
  <!-- Phone notch -->
  <rect x="108" y="96" width="44" height="10" rx="5"
        fill="#2c1810" filter="url(#rough)" opacity="0.7"/>
  <!-- Phone home bar -->
  <rect x="108" y="336" width="44" height="6" rx="3"
        fill="#2c1810" filter="url(#rough)" opacity="0.5"/>

  <!-- Screen content: chat UI sketch -->
  <rect x="80" y="120" width="80" height="14" rx="4"
        fill="#FF6B35" opacity="0.85" filter="url(#rough)"/>
  <text x="120" y="131" text-anchor="middle" font-size="9" fill="#fff"
        style="font-family: monospace;">MultiSoul</text>

  <!-- Chat bubbles on phone -->
  <rect x="84" y="142" width="70" height="22" rx="8"
        fill="#2a2a4a" stroke="#4a4a8a" stroke-width="1" filter="url(#rough)"/>
  <text x="119" y="157" text-anchor="middle" font-size="8" fill="#aaaaff"
        style="font-family: monospace;">msctl serve ▶</text>

  <rect x="100" y="172" width="78" height="22" rx="8"
        fill="#FF6B35" opacity="0.9" filter="url(#rough)"/>
  <text x="139" y="187" text-anchor="middle" font-size="8" fill="#fff"
        style="font-family: monospace;">Running! ✓</text>

  <rect x="84" y="202" width="88" height="22" rx="8"
        fill="#2a2a4a" stroke="#4a4a8a" stroke-width="1" filter="url(#rough)"/>
  <text x="128" y="217" text-anchor="middle" font-size="8" fill="#aaaaff"
        style="font-family: monospace;">tool_call: read</text>

  <rect x="84" y="232" width="88" height="22" rx="8"
        fill="#2a2a4a" stroke="#4a4a8a" stroke-width="1" filter="url(#rough)"/>
  <text x="128" y="247" text-anchor="middle" font-size="8" fill="#88ff88"
        style="font-family: monospace;">✓ file read ok</text>

  <!-- Input bar on phone -->
  <rect x="80" y="290" width="100" height="18" rx="9"
        fill="#2a2a4a" stroke="#555" stroke-width="1" filter="url(#rough)"/>
  <text x="130" y="303" text-anchor="middle" font-size="7" fill="#666"
        style="font-family: monospace;">ask agent...</text>

  <!-- Phone label -->
  <text x="130" y="378" text-anchor="middle" font-size="14" fill="#2c1810"
        filter="url(#rough)" style="font-family: Georgia, serif; font-style: italic;">
    📱 mobile
  </text>

  <!-- === MIDDLE: Connection arrows === -->
  <!-- WiFi/connection waves -->
  <g filter="url(#rough)" opacity="0.7">
    <path d="M 220 200 Q 260 170 300 200" fill="none" stroke="#FF6B35" stroke-width="2.5" stroke-dasharray="6,4"/>
    <path d="M 225 215 Q 262 190 300 215" fill="none" stroke="#FF6B35" stroke-width="2" stroke-dasharray="5,4" opacity="0.7"/>
    <path d="M 230 230 Q 265 210 300 230" fill="none" stroke="#FF6B35" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>
  </g>
  <!-- Arrow right -->
  <path d="M 215 195 L 300 195" stroke="#2c1810" stroke-width="2.5" fill="none"
        marker-end="url(#arrowhead)" filter="url(#rough)" opacity="0.8"/>
  <!-- Arrow left -->
  <path d="M 300 225 L 215 225" stroke="#2c1810" stroke-width="2" fill="none"
        stroke-dasharray="6,3" filter="url(#rough)" opacity="0.6"/>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2c1810" opacity="0.8"/>
    </marker>
  </defs>

  <!-- REST/WS label -->
  <text x="258" y="188" text-anchor="middle" font-size="10" fill="#2c1810"
        filter="url(#rough)" style="font-family: Georgia, serif;">REST/WS</text>
  <text x="258" y="248" text-anchor="middle" font-size="9" fill="#888"
        filter="url(#rough)" style="font-family: Georgia, serif; font-style: italic;">Bearer auth</text>

  <!-- === RIGHT: CLI Terminal sketch === -->
  <!-- Laptop body -->
  <rect x="320" y="100" width="230" height="160" rx="8"
        fill="#1a1a1a" stroke="#2c1810" stroke-width="3"
        filter="url(#roughStrong)"/>
  <!-- Screen bezel -->
  <rect x="330" y="108" width="210" height="144" rx="4"
        fill="#0d0d0d" stroke="#333" stroke-width="1.5" filter="url(#rough)"/>
  <!-- Terminal content -->
  <text x="342" y="128" font-size="9" fill="#FF6B35" style="font-family: monospace;">
    $ msctl serve
  </text>
  <text x="342" y="142" font-size="9" fill="#4CAF50" style="font-family: monospace;">
    ✓ Listening :8080
  </text>
  <text x="342" y="156" font-size="9" fill="#888" style="font-family: monospace;">
    ✓ SQLite ready
  </text>
  <text x="342" y="170" font-size="9" fill="#aaaaff" style="font-family: monospace;">
    → tool: read_file
  </text>
  <text x="342" y="184" font-size="9" fill="#aaaaff" style="font-family: monospace;">
    → tool: bash
  </text>
  <text x="342" y="198" font-size="9" fill="#FF6B35" style="font-family: monospace;">
    ⚡ push sent
  </text>
  <text x="342" y="212" font-size="9" fill="#4CAF50" style="font-family: monospace;">
    ✓ task complete
  </text>
  <!-- Cursor blink -->
  <rect x="342" y="220" width="7" height="11" fill="#FF6B35" opacity="0.9" filter="url(#rough)"/>

  <!-- Laptop base -->
  <rect x="300" y="262" width="270" height="14" rx="4"
        fill="#2a2a2a" stroke="#2c1810" stroke-width="2.5"
        filter="url(#roughStrong)"/>
  <!-- Trackpad -->
  <rect x="400" y="266" width="70" height="7" rx="3"
        fill="#1a1a1a" stroke="#444" stroke-width="1" filter="url(#rough)"/>

  <!-- CLI label -->
  <text x="435" y="295" text-anchor="middle" font-size="14" fill="#2c1810"
        filter="url(#rough)" style="font-family: Georgia, serif; font-style: italic;">
    💻 msctl CLI
  </text>

  <!-- === BOTTOM: Annotations === -->
  <!-- Zero backend note -->
  <g filter="url(#rough)">
    <ellipse cx="300" cy="370" rx="120" ry="28" fill="#fff3cd" stroke="#e6a817" stroke-width="2" opacity="0.9"/>
    <text x="300" y="366" text-anchor="middle" font-size="12" fill="#7a5c00"
          style="font-family: Georgia, serif; font-weight: bold;">零中心后端</text>
    <text x="300" y="382" text-anchor="middle" font-size="10" fill="#7a5c00"
          style="font-family: Georgia, serif;">数据 100% 留在本机</text>
  </g>

  <!-- Small decorative stars/doodles -->
  <text x="50" y="420" font-size="18" fill="#FF6B35" opacity="0.6" filter="url(#rough)">✦</text>
  <text x="540" y="100" font-size="14" fill="#4CAF50" opacity="0.5" filter="url(#rough)">✧</text>
  <text x="30" y="200" font-size="12" fill="#aaaaff" opacity="0.4" filter="url(#rough)">◇</text>
  <text x="560" y="380" font-size="16" fill="#FF6B35" opacity="0.4" filter="url(#rough)">✦</text>

  <!-- Handwritten caption -->
  <text x="300" y="440" text-anchor="middle" font-size="13" fill="#8B7355"
        filter="url(#rough)" style="font-family: Georgia, serif; font-style: italic;">
    phone → wifi → msctl → Claude Code ✓
  </text>

  <!-- Corner fold doodle -->
  <path d="M 560 0 L 600 0 L 600 40 Z" fill="#e8dcc8" opacity="0.5"/>
  <path d="M 560 0 L 600 40" stroke="#8B7355" stroke-width="1.5" opacity="0.4"/>
</svg>
