[package]
name = "fix-bug-bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fix-bug-bot"
path = "src/main.rs"

[dependencies]
anyhow     = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
dirs       = "5"
uuid       = { version = "1", features = ["v4"] }
rusqlite   = { version = "0.31", features = ["bundled"] }
reqwest    = { version = "0.11", features = ["blocking", "json"] }

[dev-dependencies]
tempfile = "3"
