<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480">
  <rect width="1440" height="480" fill="#040D04"/>

  <rect x="0" y="0" width="720" height="480" fill="#040D04"/>
  <rect x="720" y="0" width="720" height="480" fill="#061206"/>

  <g transform="translate(60 112)">
    <g transform="translate(0 0)">
      <circle cx="7" cy="7" r="5" fill="none" stroke="#2D8B2D" stroke-width="1.8"/>
      <path d="M7 0v3M7 11v3M0 7h3M11 7h3M2.1 2.1l2.1 2.1M9.8 9.8l2.1 2.1M11.9 2.1 9.8 4.2M4.2 9.8 2.1 11.9" stroke="#2D8B2D" stroke-width="1.4" stroke-linecap="round"/>
      <text x="22" y="11" fill="#2D8B2D" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" letter-spacing="2">CONFIGURATION</text>
    </g>

    <text x="0" y="73" fill="#20C20E" font-family="Anton, Impact, sans-serif" font-size="52" font-weight="400">
      <tspan x="0" dy="0">VAULT-TEC</tspan>
      <tspan x="0" dy="57">SETTINGS</tspan>
    </text>

    <text x="0" y="182" fill="#147A16" font-family="Geist, Inter, Arial, sans-serif" font-size="15">
      <tspan x="0" dy="0">Configure visual effects, layout preferences, and terminal</tspan>
      <tspan x="0" dy="24">behavior. Toggle CRT scanlines, vignette strength, and</tspan>
      <tspan x="0" dy="24">companion display from the Overseer control panel.</tspan>
    </text>

    <g transform="translate(0 272)">
      <rect width="174" height="43" rx="2" fill="#20C20E"/>
      <text x="24" y="27" fill="#040D04" font-family="Anton, Impact, sans-serif" font-size="13" letter-spacing="1">OPEN SETTINGS</text>
      <text x="190" y="26" fill="#2D8B2D" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing=".5">READ MANUAL</text>
      <path d="M288 22h13M296 17l5 5-5 5" fill="none" stroke="#2D8B2D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g transform="translate(840 90)">
    <rect x="0" y="0" width="480" height="300" fill="#061206" stroke="#0F2B0F"/>

    <rect x="0" y="0" width="480" height="44" fill="#0A1A0A"/>
    <line x1="0" y1="44" x2="480" y2="44" stroke="#0F2B0F"/>
    <text x="16" y="28" fill="#20C20E" font-family="Anton, Impact, sans-serif" font-size="13" letter-spacing="1">VAULT-TEC SETTINGS</text>
    <path d="M448 15l14 14M462 15l-14 14" stroke="#2D8B2D" stroke-width="1.8" stroke-linecap="round"/>

    <g font-family="Geist, Inter, Arial, sans-serif" font-size="13">
      <g transform="translate(0 52)">
        <text x="16" y="28" fill="#20C20E">CRT Scanlines</text>
        <rect x="420" y="9" width="44" height="26" rx="2" fill="#0F2B0F"/>
        <text x="430" y="27" fill="#33FF33" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">ON</text>
      </g>

      <g transform="translate(0 96)">
        <rect width="480" height="44" fill="#040D04"/>
        <text x="16" y="28" fill="#20C20E">Vignette Strength</text>
        <text x="430" y="28" fill="#33FF33">0.75</text>
      </g>

      <g transform="translate(0 140)">
        <text x="16" y="28" fill="#20C20E">Companion Display</text>
        <rect x="420" y="9" width="44" height="26" rx="2" fill="#0F2B0F"/>
        <text x="430" y="27" fill="#33FF33" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">ON</text>
      </g>

      <g transform="translate(0 184)">
        <rect width="480" height="44" fill="#040D04"/>
        <text x="16" y="28" fill="#20C20E">Scan Speed</text>
        <text x="420" y="28" fill="#33FF33">0.012</text>
      </g>

      <g transform="translate(0 228)">
        <text x="16" y="28" fill="#20C20E">Home Screen</text>
        <rect x="398" y="9" width="66" height="26" rx="2" fill="#0F2B0F"/>
        <text x="408" y="27" fill="#20C20E" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">LARGE</text>
      </g>
    </g>

    <rect x="0" y="264" width="480" height="36" fill="#040D04"/>
    <line x1="0" y1="264" x2="480" y2="264" stroke="#0F2B0F"/>
    <text x="84" y="286" fill="#0F6B0F" font-family="Inter, Arial, sans-serif" font-size="10" letter-spacing="1">[ESC] CLOSE</text>
    <text x="198" y="286" fill="#0F6B0F" font-family="Inter, Arial, sans-serif" font-size="10" letter-spacing="1">[UP/DOWN] NAVIGATE</text>
    <text x="356" y="286" fill="#0F6B0F" font-family="Inter, Arial, sans-serif" font-size="10" letter-spacing="1">[ENTER] TOGGLE</text>
  </g>
</svg>
