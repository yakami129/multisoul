spring:
  application:
    name: multisoul-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:multisoul}
    username: ${DB_USER:multisoul}
    password: ${DB_PASSWORD:multisoul}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  encryption:
    key: ${ENCRYPTION_KEY:00000000000000000000000000000000}
  platform:
    secret: ${PLATFORM_SECRET:dev-platform-secret}
