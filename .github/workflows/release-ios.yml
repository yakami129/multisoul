name: Release iOS

# Tag push uses the `ios-v*` prefix so TestFlight release does not run when only
# releasing the CLI (`v*` → release-cli.yml). App marketing version in
# `app.json` should match the semver in the tag (e.g. ios-v1.2.3 → 1.2.3).
on:
  push:
    tags:
      - "ios-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Record label for this run, e.g. ios-v1.0.0 (EAS reads app.json/eas.json)"
        required: true
        type: string

concurrency:
  group: release-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI checks
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build-and-submit:
    name: EAS Build + Submit to TestFlight
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build iOS (EAS)
        run: npx eas-cli@18.9.1 build --platform ios --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to TestFlight
        run: npx eas-cli@18.9.1 submit --platform ios --non-interactive --latest
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
