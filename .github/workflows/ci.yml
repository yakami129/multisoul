name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: repo checks (constraints)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AGENTS.md size cap
        run: bash scripts/check-agents-md-size.sh

      - name: No hardcoded secrets
        run: bash scripts/check-no-secrets.sh

      # - name: Mobile palette compliance
      #   run: bash scripts/check-mobile-colors.sh

      - name: Max file line count (500)
        run: bash scripts/check-max-file-lines.sh

      - name: No #[allow] in Rust source
        run: bash scripts/check-no-allow.sh

      - name: CLI unit test layout (cli/tests mirrors cli/src)
        run: bash scripts/check-cli-test-layout.sh

      - name: CLI command layout (R14 grouped top-level commands)
        run: bash scripts/check-cli-command-layout.sh

      - name: Agent skill adapters
        run: python3 scripts/check-agent-skill-adapters.py

      - name: docs knowledge indices match files
        run: python3 scripts/check-docs-indices.py

      - name: docs code hashes stay fresh
        run: python3 scripts/check-doc-code-hashes.py --check

      - name: iOS Info.plist permission alignment (R12)
        run: bash scripts/check-ios-permissions.sh

  mobile-check:
    name: mobile (typecheck + lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: expo-doctor
        run: npx expo-doctor

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm exec jest --watchAll=false --forceExit --coverage --coverageReporters=text-summary

  cli-e2e:
    name: cli (serve e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Build
        run: cargo build --locked
      - name: Serve E2E
        run: cargo test --test e2e_tests --locked

  cli-check:
    name: cli (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Build
        run: cargo build --all-targets --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Format check
        run: cargo fmt --check
