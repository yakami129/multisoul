name: Publish npm Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-npm:
    name: Publish npm Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli/npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "${{ inputs.version }}" \
            --repo "${{ github.repository }}" \
            --pattern "msctl-*" \
            --dir artifacts

      - name: Set package version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          npm version "${version#v}" --no-git-tag-version --allow-same-version

      - name: Assemble bundled binaries
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          mkdir -p vendor

          tar -xzf "artifacts/msctl-${version}-aarch64-apple-darwin.tar.gz" -C artifacts
          mkdir -p vendor/aarch64-apple-darwin
          cp "artifacts/msctl-${version}-aarch64-apple-darwin/msctl" "vendor/aarch64-apple-darwin/msctl"
          chmod +x "vendor/aarch64-apple-darwin/msctl"

          tar -xzf "artifacts/msctl-${version}-x86_64-unknown-linux-gnu.tar.gz" -C artifacts
          mkdir -p vendor/x86_64-unknown-linux-gnu
          cp "artifacts/msctl-${version}-x86_64-unknown-linux-gnu/msctl" "vendor/x86_64-unknown-linux-gnu/msctl"
          chmod +x "vendor/x86_64-unknown-linux-gnu/msctl"

          unzip -q "artifacts/msctl-${version}-x86_64-pc-windows-msvc.zip" -d artifacts
          mkdir -p vendor/x86_64-pc-windows-msvc
          cp "artifacts/msctl-${version}-x86_64-pc-windows-msvc/msctl.exe" "vendor/x86_64-pc-windows-msvc/msctl.exe"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Verify npm package
        run: npm pack --dry-run

      - name: Publish npm package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
