name: Release CLI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  CLI_NAME: msctl
  IMAGE_NAME: ghcr.io/${{ github.repository }}/msctl

jobs:
  ci:
    name: CI checks
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: ci
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: msctl
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: msctl
          # macos-13 retired (Dec 2025); Intel macOS builds use macos-15-intel until ~Aug 2027.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            binary: msctl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: msctl.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Test CLI
        run: cargo test --locked

      - name: Build CLI
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          fi
          version="${version#v}"
          package="${CLI_NAME}-${version}-${{ matrix.target }}"
          mkdir -p "dist/${package}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${package}/"
          cp README.md "dist/${package}/README.md"

          if [ "${{ matrix.archive }}" = "zip" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/${package}/*' -DestinationPath 'dist/${package}.zip' -Force"
          else
            tar -czf "dist/${package}.tar.gz" -C dist "${package}"
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: msctl-${{ matrix.target }}
          path: |
            cli/dist/*.tar.gz
            cli/dist/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          files: dist/*
          generate_release_notes: true

  publish-container:
    name: Publish GHCR Image
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cli/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-npm:
    name: Publish npm Package
    needs: build-binaries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli/npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: cli/npm/artifacts
          merge-multiple: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Set package version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          fi
          version="${version#v}"
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Assemble bundled binaries
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          mkdir -p vendor

          tar -xzf "artifacts/msctl-${version}-aarch64-apple-darwin.tar.gz" -C artifacts
          mkdir -p vendor/aarch64-apple-darwin
          cp "artifacts/msctl-${version}-aarch64-apple-darwin/msctl" "vendor/aarch64-apple-darwin/msctl"
          chmod +x "vendor/aarch64-apple-darwin/msctl"

          tar -xzf "artifacts/msctl-${version}-x86_64-apple-darwin.tar.gz" -C artifacts
          mkdir -p vendor/x86_64-apple-darwin
          cp "artifacts/msctl-${version}-x86_64-apple-darwin/msctl" "vendor/x86_64-apple-darwin/msctl"
          chmod +x "vendor/x86_64-apple-darwin/msctl"

          tar -xzf "artifacts/msctl-${version}-x86_64-unknown-linux-gnu.tar.gz" -C artifacts
          mkdir -p vendor/x86_64-unknown-linux-gnu
          cp "artifacts/msctl-${version}-x86_64-unknown-linux-gnu/msctl" "vendor/x86_64-unknown-linux-gnu/msctl"
          chmod +x "vendor/x86_64-unknown-linux-gnu/msctl"

          unzip -q "artifacts/msctl-${version}-x86_64-pc-windows-msvc.zip" -d artifacts
          mkdir -p vendor/x86_64-pc-windows-msvc
          cp "$(find artifacts -path '*/msctl.exe' -o -name 'msctl.exe' | head -1)" "vendor/x86_64-pc-windows-msvc/msctl.exe"

      - name: Verify npm package
        run: npm pack --dry-run

      - name: Publish npm package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
