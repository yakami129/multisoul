[package]
name = "msctl"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "msctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
anyhow = "1"

[dev-dependencies]
mockito = "1"
tempfile = "3"
